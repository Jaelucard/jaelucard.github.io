- constraint_id: HOST_OBLIGATIONS
  statement: Host provides an appropriate stipend (amount decided by host), a conducive working environment, a designated supervisor or reporting officer with periodic reviews, and feedback to Business China after the stint. Intern bears airfare, insurance and accommodation; medical exam cost is at host discretion.
  status: VERIFIED
  source: https://yes.businesschina.org.sg/for-companies/
  source_type: implementing_agency
  date_verified: 2026-09-07
  applies_to: host
  confidence: high
  notes: null
  requires_action: null
  next_verification_date: 2027-01-01

- constraint_id: Z_VISA_PROCESS_CHAIN
  statement: Host issues internship contract; school applies for Letter of Confirmation (LOC) from Business China; with the LOC the host applies for an entry permit at the work-permit authority and sends it to the intern; intern applies for the Z visa at the Chinese Embassy in Singapore; on arrival the intern completes a medical check-up; for internships of 90 days or more the intern applies for the Work Permit for Foreigners within 15 days; then applies for a Residence Permit at the local Exit and Entry Administration.
  status: VERIFIED
  source: https://yes.businesschina.org.sg/
  source_type: implementing_agency
  date_verified: 2026-09-07
  applies_to: all
  confidence: high
  notes: The YES FAQ page still says "internship visa, details to follow"; the process page is more recent and specific and is treated as current.
  requires_action: null
  next_verification_date: 2027-01-01

